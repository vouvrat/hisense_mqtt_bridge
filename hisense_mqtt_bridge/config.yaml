name: "Hisense TV MQTT Bridge"
version: "2.0.0"
slug: hisense_mqtt_bridge
description: "Bridge MQTT pour contrôler une TV Hisense VIDAA-U (power, volume, mute, source, chaîne, navigation) via topics MQTT"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

options:
  mqtt_broker: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: "hisense_tv"
  tv_ip: ""
  tv_port: 10001
  tv_name: "salon"
  tv_ssl: false
  auto_discovery: true
  scan_interval: 30
  log_level: "INFO"

schema:
  mqtt_broker: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  tv_ip: str
  tv_port: int(1,65535)
  tv_name: str
  tv_ssl: bool
  auto_discovery: bool
  scan_interval: int(10,300)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
